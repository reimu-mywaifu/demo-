<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="方結租屋 — 精選台北、新北優質套房，完整篩選功能幫你快速找到理想房源。">
  <title>租屋資訊 — 方結租屋有限公司</title>
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-placeholder"></div>

<!-- Page Header -->
<section class="page-header" style="padding-top:6rem">
  <div class="container">
    <div class="page-header-icon"><i class="bi bi-building"></i></div>
    <h1 class="section-title">租屋資訊</h1>
    <p class="text-muted">精選台北、新北優質套房，每間都經過嚴格把關，讓你租得安心、住得舒心。</p>
  </div>
</section>

<!-- Filter Bar -->
<section class="py-4">
  <div class="container">
    <div class="filter-bar" id="listingsFilter">
      <div class="d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-sliders" style="color:var(--m-green)"></i>
        <span class="fw-semibold small">篩選條件</span>
      </div>
      <div class="row g-3">
        <div class="col-md-4">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0" style="border:2px solid var(--m-border);border-radius:var(--m-radius-sm) 0 0 var(--m-radius-sm)"><i class="bi bi-search text-muted"></i></span>
            <input type="text" class="form-control border-start-0" id="searchInput" placeholder="搜尋關鍵字..." style="border:2px solid var(--m-border);border-left:0;border-radius:0 var(--m-radius-sm) var(--m-radius-sm) 0">
          </div>
        </div>
        <div class="col-md-4">
          <select class="form-select" id="areaSelect" style="border:2px solid var(--m-border);border-radius:var(--m-radius-sm)">
            <option value="">全部區域</option>
            <option>大安區</option><option>板橋區</option><option>永和區</option><option>淡水區</option><option>信義區</option>
          </select>
        </div>
        <div class="col-md-4">
          <select class="form-select" id="priceSelect" style="border:2px solid var(--m-border);border-radius:var(--m-radius-sm)">
            <option value="">全部價格</option>
            <option value="0-5000">$5,000 以下</option>
            <option value="5000-8000">$5,000 - $8,000</option>
            <option value="8000-12000">$8,000 - $12,000</option>
            <option value="12000-999999">$12,000 以上</option>
          </select>
        </div>
      </div>
      <!-- Feature Tags -->
      <div class="mt-3 pt-3" style="border-top:1px solid var(--m-border)">
        <small class="text-muted d-block mb-2">特色篩選：</small>
        <div id="featureTags">
          <button class="tag-morandi tag-filter" data-tag="可養寵物 🐾">可養寵物 🐾</button>
          <button class="tag-morandi tag-filter" data-tag="有陽台 🌿">有陽台 🌿</button>
          <button class="tag-morandi tag-filter" data-tag="近捷運 🚇">近捷運 🚇</button>
          <button class="tag-morandi tag-filter" data-tag="獨立洗脫烘 🧺">獨立洗脫烘 🧺</button>
          <button class="tag-morandi tag-filter" data-tag="含水網路 📶">含水網路 📶</button>
          <button class="tag-morandi tag-filter" data-tag="全新裝潢 ✨">全新裝潢 ✨</button>
        </div>
      </div>
    </div>

    <!-- Results Count -->
    <div class="d-flex justify-content-between align-items-center my-4">
      <p class="text-muted small mb-0">共找到 <strong id="resultCount">0</strong> 間房源</p>
      <button class="btn btn-sm btn-morandi-outline d-none" id="clearFilters" onclick="clearAllFilters()">清除篩選</button>
    </div>

    <!-- Property Grid -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4" id="listingsGrid"></div>

    <!-- No Results -->
    <div class="text-center py-5 d-none" id="noResults">
      <p class="fs-1 mb-3">🏠</p>
      <h4 class="fw-bold mb-2">沒有找到符合條件的房源</h4>
      <p class="text-muted">試試調整篩選條件，或瀏覽全部房源</p>
      <button class="btn btn-morandi mt-3" onclick="clearAllFilters()">清除篩選條件</button>
    </div>
  </div>
</section>

<!-- Property Modal -->
<div class="modal fade modal-morandi" id="propertyModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="propertyModalLabel"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script>
let activeTags = [];

function applyFilters() {
  const q = $('#searchInput').val().toLowerCase();
  const area = $('#areaSelect').val();
  const priceVal = $('#priceSelect').val();

  let results = PROPERTIES;
  if (q) results = results.filter(p =>
    p.title.toLowerCase().includes(q) || p.area.includes(q) || p.address.toLowerCase().includes(q)
  );
  if (area) results = results.filter(p => p.area === area);
  if (priceVal) {
    const [min, max] = priceVal.split('-').map(Number);
    results = results.filter(p => p.price >= min && p.price <= max);
  }
  if (activeTags.length > 0) {
    results = results.filter(p => activeTags.some(tag => p.tags.includes(tag)));
  }

  $('#resultCount').text(results.length);
  if (results.length > 0) {
    $('#listingsGrid').html(results.map(renderPropertyCard).join('')).removeClass('d-none');
    $('#noResults').addClass('d-none');
  } else {
    $('#listingsGrid').addClass('d-none');
    $('#noResults').removeClass('d-none');
  }

  // Show clear button if any filter active
  if (q || area || priceVal || activeTags.length > 0) {
    $('#clearFilters').removeClass('d-none');
  } else {
    $('#clearFilters').addClass('d-none');
  }
  if (typeof AOS !== 'undefined') AOS.refresh();
}

function clearAllFilters() {
  $('#searchInput').val('');
  $('#areaSelect').val('');
  $('#priceSelect').val('');
  activeTags = [];
  $('.tag-filter').removeClass('active');
  applyFilters();
}

$(document).ready(function() {
  applyFilters();

  $('#searchInput, #areaSelect, #priceSelect').on('input change', applyFilters);

  $(document).on('click', '.tag-filter', function() {
    const tag = $(this).data('tag');
    $(this).toggleClass('active');
    if (activeTags.includes(tag)) {
      activeTags = activeTags.filter(t => t !== tag);
    } else {
      activeTags.push(tag);
    }
    applyFilters();
  });
});
</script>
</body>
</html>
