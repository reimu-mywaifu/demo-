<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="方結租屋 — 租屋指南文章">
  <title>文章 — 方結租屋有限公司</title>
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-placeholder"></div>

<!-- Blog Hero (Dynamic) -->
<div id="blogHero"></div>

<!-- Blog Content -->
<div class="container" style="max-width:780px;padding-top:2rem;padding-bottom:3rem">
  <a href="blog.html" class="d-inline-flex align-items-center gap-2 mb-4 fw-medium small" style="color:var(--m-green)">
    <i class="bi bi-arrow-left"></i> 回到租屋指南
  </a>
  <article class="blog-content" id="blogContent"></article>
  <div class="d-flex align-items-center gap-2 mt-4 pt-4" style="border-top:1px solid var(--m-border)">
    <i class="bi bi-tag" style="color:var(--m-tea)"></i>
    <span class="tag-morandi" id="blogTag"></span>
  </div>
</div>

<!-- Related Properties -->
<div id="relatedProperties"></div>

<!-- Related Posts -->
<div id="relatedPosts"></div>

<!-- Property Modal -->
<div class="modal fade modal-morandi" id="propertyModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="propertyModalLabel"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script>
$(document).ready(function() {
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'));
  const post = POSTS.find(p => p.id === id);

  if (!post) {
    $('#blogHero').html(`
      <div class="page-header" style="padding-top:6rem">
        <div class="container text-center">
          <p class="fs-1 mb-3">📝</p>
          <h1 class="section-title">找不到這篇文章</h1>
          <a href="blog.html" class="btn btn-morandi mt-3"><i class="bi bi-arrow-left me-2"></i>回到租屋指南</a>
        </div>
      </div>`);
    $('#blogContent, #relatedProperties, #relatedPosts').hide();
    return;
  }

  // Update page title
  document.title = post.title + ' — 方結租屋有限公司';

  // Hero
  $('#blogHero').html(`
    <div class="blog-hero" style="margin-top:64px">
      <img src="${post.coverImage}" alt="${post.title}">
      <div class="blog-hero-overlay">
        <div class="container" style="max-width:780px">
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="tag-morandi" style="background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(4px)">${post.category}</span>
            <small class="text-white-50"><i class="bi bi-calendar3 me-1"></i>${post.publishDate}</small>
          </div>
          <h1 class="text-white fw-bold" style="font-size:clamp(1.5rem,3.5vw,2.2rem)">${post.title}</h1>
        </div>
      </div>
    </div>`);

  // Content
  $('#blogContent').html(post.content);
  $('#blogTag').text(post.category);

  // Related Properties
  const relatedProps = PROPERTIES.filter(p => post.relatedPropertyIds && post.relatedPropertyIds.includes(p.id));
  if (relatedProps.length) {
    $('#relatedProperties').html(`
      <section class="section-morandi bg-cream">
        <div class="container">
          <div class="d-flex align-items-end justify-content-between mb-4">
            <div><div class="section-label">🏠 推薦房源</div><h2 class="section-title">適合此文章的房源</h2></div>
            <a href="listings.html" class="text-decoration-none d-none d-sm-inline-flex align-items-center gap-1 fw-semibold small" style="color:var(--m-green)">查看全部 <i class="bi bi-arrow-right"></i></a>
          </div>
          <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">${relatedProps.map(renderPropertyCard).join('')}</div>
        </div>
      </section>`);
  }

  // Related Posts (same category)
  const relatedPostsList = POSTS.filter(p => p.id !== post.id && p.category === post.category).slice(0, 2);
  if (relatedPostsList.length) {
    $('#relatedPosts').html(`
      <section class="section-morandi">
        <div class="container">
          <div class="mb-4"><div class="section-label">📝 延伸閱讀</div><h2 class="section-title">相關文章推薦</h2></div>
          <div class="row row-cols-1 row-cols-md-2 g-4">${relatedPostsList.map(renderBlogCard).join('')}</div>
        </div>
      </section>`);
  }

  if (typeof AOS !== 'undefined') AOS.refresh();
});
</script>
</body>
</html>
