<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="馬克租屋 — 實用的租屋知識與經驗分享，幫助你成為精明的租屋達人。">
  <title>租屋指南 — 馬克租屋有限公司</title>
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-placeholder"></div>

<!-- Page Header -->
<section class="page-header" style="padding-top:6rem">
  <div class="container">
    <div class="page-header-icon"><i class="bi bi-journal-text"></i></div>
    <h1 class="section-title">租屋指南</h1>
    <p class="text-muted">實用的租屋知識與經驗分享，幫助你成為精明的租屋達人。</p>
  </div>
</section>

<!-- Category Filter & Blog Grid -->
<section class="section-morandi" style="padding-top:2rem">
  <div class="container">
    <!-- Category Buttons -->
    <div class="d-flex flex-wrap gap-2 mb-4" id="blogCategories">
      <button class="btn btn-sm px-4 py-2 rounded-pill fw-medium cat-btn active" data-cat="全部" style="font-size:.88rem">全部</button>
    </div>

    <!-- Blog Grid -->
    <div class="row row-cols-1 row-cols-md-2 g-4" id="blogGrid"></div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script>
$(document).ready(function() {
  // Build category buttons
  const categories = ['全部', ...new Set(POSTS.map(p => p.category))];
  $('#blogCategories').html(categories.map(c =>
    `<button class="btn btn-sm px-4 py-2 rounded-pill fw-medium cat-btn ${c === '全部' ? 'active' : ''}" data-cat="${c}" style="font-size:.88rem">${c}</button>`
  ).join(''));

  // Style active/inactive
  function updateCatStyles() {
    $('.cat-btn').each(function() {
      if ($(this).hasClass('active')) {
        $(this).css({ background: 'var(--m-green)', color: '#fff', border: 'none', boxShadow: '0 4px 12px rgba(168,181,162,.4)' });
      } else {
        $(this).css({ background: '#fff', color: 'var(--m-dark-soft)', border: '1px solid var(--m-border)', boxShadow: 'none' });
      }
    });
  }

  function renderBlogGrid(cat) {
    const filtered = cat === '全部' ? POSTS : POSTS.filter(p => p.category === cat);
    $('#blogGrid').html(filtered.map(renderBlogCard).join(''));
    if (typeof AOS !== 'undefined') AOS.refresh();
  }

  $(document).on('click', '.cat-btn', function() {
    $('.cat-btn').removeClass('active');
    $(this).addClass('active');
    updateCatStyles();
    renderBlogGrid($(this).data('cat'));
  });

  renderBlogGrid('全部');
  updateCatStyles();
});
</script>
</body>
</html>
