<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="馬克租屋 — 線上預約看房、聯絡我們，客服專線、Line@ 快速諮詢。">
  <title>聯絡我們 — 馬克租屋有限公司</title>
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-placeholder"></div>

<!-- Page Header -->
<section class="page-header" style="padding-top:6rem">
  <div class="container">
    <div class="page-header-icon"><i class="bi bi-telephone"></i></div>
    <h1 class="section-title">聯絡我們</h1>
    <p class="text-muted">有任何租屋相關問題，或想預約看房，歡迎透過以下方式與我們聯繫。</p>
  </div>
</section>

<!-- Contact Content -->
<section class="section-morandi" style="padding-top:2rem">
  <div class="container">
    <div class="row g-4">
      <!-- Form -->
      <div class="col-lg-7" data-aos="fade-up">
        <div class="bg-white rounded-morandi p-4 p-md-5 shadow-morandi border-morandi">
          <h4 class="fw-bold mb-4">📋 線上預約看房</h4>
          <div id="formContainer">
            <form id="contactForm" class="form-morandi" onsubmit="handleContactSubmit(event)">
              <div class="row g-3">
                <div class="col-sm-6">
                  <label>姓名 *</label>
                  <input type="text" class="form-control" placeholder="請輸入您的姓名" required>
                </div>
                <div class="col-sm-6">
                  <label>聯絡電話 *</label>
                  <input type="tel" class="form-control" placeholder="0912-345-678" required>
                </div>
                <div class="col-12">
                  <label>電子信箱</label>
                  <input type="email" class="form-control" placeholder="your@email.com">
                </div>
                <div class="col-sm-6">
                  <label>洽詢類型</label>
                  <select class="form-select">
                    <option>預約看房</option>
                    <option>租屋諮詢</option>
                    <option>維修通報</option>
                    <option>合約相關</option>
                    <option>其他問題</option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label>希望看房日期</label>
                  <input type="date" class="form-control">
                </div>
                <div class="col-12">
                  <label>留言內容</label>
                  <textarea class="form-control" rows="4" placeholder="請描述您的需求，例如：希望的地區、預算範圍、特殊需求等..."></textarea>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-morandi w-100 py-3"><i class="bi bi-send me-2"></i>送出預約</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="col-lg-5" data-aos="fade-up" data-aos-delay="100">
        <!-- Quick Contact -->
        <div class="bg-white rounded-morandi p-4 shadow-morandi border-morandi mb-4">
          <h5 class="fw-bold mb-3">📞 聯絡方式</h5>
          <div class="d-flex flex-column gap-3">
            <a href="tel:0223456789" class="contact-card">
              <div class="contact-card-icon"><i class="bi bi-telephone-fill"></i></div>
              <div><small class="text-muted d-block">客服專線</small><span class="fw-semibold">(02) 2345-6789</span></div>
            </a>
            <a href="mailto:hello@markrental.tw" class="contact-card">
              <div class="contact-card-icon"><i class="bi bi-envelope-fill"></i></div>
              <div><small class="text-muted d-block">電子信箱</small><span class="fw-semibold">hello@markrental.tw</span></div>
            </a>
            <a href="#" class="contact-card" style="background:rgba(6,199,85,.05)">
              <div class="contact-card-icon" style="background:rgba(6,199,85,.1);color:#06C755"><i class="bi bi-chat-dots-fill"></i></div>
              <div><small class="text-muted d-block">Line@ 快速諮詢</small><span class="fw-semibold">@markrental</span></div>
            </a>
          </div>
        </div>

        <!-- Address & Map -->
        <div class="bg-white rounded-morandi p-4 shadow-morandi border-morandi mb-4">
          <h5 class="fw-bold mb-3">📍 公司位置</h5>
          <div class="d-flex align-items-start gap-2 mb-3">
            <i class="bi bi-geo-alt-fill mt-1" style="color:var(--m-green)"></i>
            <div>
              <p class="fw-medium small mb-0">台北市大安區羅斯福路三段 100 號 2 樓</p>
              <small class="text-muted">（捷運公館站 2 號出口步行 3 分鐘）</small>
            </div>
          </div>
          <div class="rounded-morandi-sm overflow-hidden border-morandi">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3615.8!2d121.534!3d25.0173!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442a989a550f555%3A0xa1a2b0c1d2e3f456!2z5YWs6aSo56uZ!5e0!3m2!1szh-TW!2stw!4v1690000000000"
              width="100%" height="200" style="border:0" allowfullscreen loading="lazy" title="馬克租屋位置">
            </iframe>
          </div>
        </div>

        <!-- Business Hours -->
        <div class="bg-white rounded-morandi p-4 shadow-morandi border-morandi">
          <h5 class="fw-bold mb-3"><i class="bi bi-clock me-2" style="color:var(--m-green)"></i>營業時間</h5>
          <div class="hours-row"><span class="fw-medium">週一至週五</span><span class="fw-medium" style="color:var(--m-green)">09:00 - 18:00</span></div>
          <div class="hours-row"><span class="fw-medium">週六</span><span class="fw-medium" style="color:var(--m-green)">10:00 - 17:00</span></div>
          <div class="hours-row"><span class="fw-medium">週日</span><span class="text-muted">公休</span></div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script>
function handleContactSubmit(e) {
  e.preventDefault();
  document.getElementById('formContainer').innerHTML = `
    <div class="text-center py-5 success-check">
      <i class="bi bi-check-circle-fill" style="font-size:4rem;color:var(--m-green)"></i>
      <h4 class="fw-bold mt-3 mb-2">預約已送出！</h4>
      <p class="text-muted">我們將於 1 個工作日內與您聯繫確認看房時間。<br>若有緊急需求，請直接撥打客服專線。</p>
      <button class="btn btn-morandi mt-3" onclick="location.reload()">再送一筆預約</button>
    </div>`;
}
</script>
</body>
</html>
